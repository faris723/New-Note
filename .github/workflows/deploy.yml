name: Deploy Web Preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Memberikan izin untuk menulis ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Sesuaikan dengan folder output build Vite Anda (biasanya dist)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
