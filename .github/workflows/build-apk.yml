name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Opsional: versi release, misalnya v1.0.2. Release bridge ini tetap memakai signing key lama agar update tidak perlu uninstall."
        required: false
        type: string
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    name: Build debug artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - working-directory: android
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    name: Build signed release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew
      - name: Build compatibility release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Create manual tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.release_tag }}"
          git push origin "${{ inputs.release_tag }}"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
