name: Build Android APK (Aplikasi Mandiri Tanpa Browser)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Setup Node.js ke versi 22 (Sesuai permintaan Capacitor)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 2. Install dependensi dan Build Web Assets
      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      # 3. Sinkronisasi Web App ke folder Android
      - name: Sync Capacitor Android
        run: bunx cap sync android

      # 4. Setup Java 17 (Wajib untuk Capacitor Android)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 5. Setup Gradle Resmi (Mencegah error file gradlew tidak ditemukan)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 6. Melakukan Build APK 
      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug

      # 7. Mengunggah hasil APK ke GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
