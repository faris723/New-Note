name: Build Android APK (Aplikasi Mandiri Tanpa Browser)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Membersihkan baris konfigurasi yang rusak di app/build.gradle jika ada
      - name: Clean Up Broken Configurations
        working-directory: ./android/app
        run: |
          if grep -q "configurations.all" build.gradle; then
            sed -i '/configurations.all/d' build.gradle
          fi

      # 2. Konfigurasi file pendukung Android yang diperlukan
      - name: Fix Missing Android Configuration Files
        working-directory: ./android
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          echo "include ':app'" > settings.gradle
          echo "include ':capacitor-cordova-android-plugins'" >> settings.gradle
          echo "project(':capacitor-cordova-android-plugins').projectDir = new File(rootProject.projectDir, 'capacitor-cordova-android-plugins')" >> settings.gradle
          echo "apply from: 'capacitor.settings.gradle'" >> settings.gradle

          if [ -f "variables.gradle" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/g' variables.gradle
          fi

      # 3. Membuat Gradle Wrapper dan memberikan izin eksekusi
      - name: Generate Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      # 4. Build Android APK menggunakan wrapper
      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
