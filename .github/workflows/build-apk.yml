name: Build Android APK (Aplikasi Mandiri Tanpa Browser)

on:
  workflow_dispatch: # Mengizinkan Anda menekan tombol "Run workflow" secara manual
  push:
    branches:
      - main # Akan otomatis jalan jika ada push ke branch main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Setup Node.js dan Bun (Karena proyek Anda menggunakan bun.lock)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 2. Install dependensi dan Build Web Assets
      - name: Install Dependencies
        run: bun install

      - name: Build Web App
        run: bun run build

      # 3. Sinkronisasi Web App ke folder Android (Capacitor)
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 4. Setup Java 17 (Wajib untuk Capacitor 5/6 dan Android)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 5. Memberikan izin eksekusi agar Gradle tidak "Permission Denied"
      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      # 6. Melakukan Build APK
      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      # 7. Mengunggah hasil APK agar bisa di-download di GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
