name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Kosongkan untuk build debug. Isi misalnya v1.0.8 untuk membuat release APK kompatibel dengan versi lama.'
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore required Android project files
        run: |
          test -f android/settings.gradle
          test -f android/gradle.properties
          test -f android/app/debug.keystore

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-debug-v${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release:
    name: Build compatibility release APK
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify release tag matches app version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ inputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          test "$APP_VERSION" = "$TAG_VERSION"

      - name: Verify compatibility signing key
        run: |
          test -f android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Build compatibility release APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "${BUILD_TOOLS}/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-release-${{ inputs.release_tag }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
