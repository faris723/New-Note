name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Kosongkan untuk build debug. Isi misalnya v1.0.12 untuk membuat release APK kompatibel dengan versi lama.'
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build debug APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify npm manifest and lockfile
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (!root) throw new Error('package-lock.json has no root package entry');
          if (root.name !== pkg.name || root.version !== pkg.version) throw new Error(`Lock root ${root.name}@${root.version} does not match ${pkg.name}@${pkg.version}`);
          for (const field of ['dependencies','devDependencies']) {
            const a = JSON.stringify(pkg[field] || {});
            const b = JSON.stringify(root[field] || {});
            if (a !== b) throw new Error(`package.json and package-lock.json ${field} are out of sync`);
          }
          if (!lock.packages['node_modules/@capacitor/app']) throw new Error('Missing @capacitor/app in lockfile');
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Verify fresh web bundle is packaged
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR=android/app/src/main/assets/public/assets
          test -d "$ASSET_DIR"
          test -n "$(find "$ASSET_DIR" -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          for needle in cp104ImageBtn insertFileBtn cp104-inline-note cp104FileEditModal; do
            if ! grep -Rqs -- "$needle" "$ASSET_DIR"; then
              echo "ERROR: fresh Capacitor bundle is missing: $needle"
              find "$ASSET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
              exit 1
            fi
          done
          test -f android/app/src/main/java/com/catatanpintar/app/PdfViewerPlugin.java
          test -f android/app/src/main/java/com/catatanpintar/app/FileExportPlugin.java

      - name: Restore required Android project files
        run: |
          test -f android/settings.gradle
          test -f android/gradle.properties
          test -f android/app/debug.keystore

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Gradle wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-debug-v${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release:
    name: Build compatibility release APK
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify npm manifest and lockfile
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (!root) throw new Error('package-lock.json has no root package entry');
          if (root.name !== pkg.name || root.version !== pkg.version) throw new Error(`Lock root ${root.name}@${root.version} does not match ${pkg.name}@${pkg.version}`);
          for (const field of ['dependencies','devDependencies']) {
            const a = JSON.stringify(pkg[field] || {});
            const b = JSON.stringify(root[field] || {});
            if (a !== b) throw new Error(`package.json and package-lock.json ${field} are out of sync`);
          }
          if (!lock.packages['node_modules/@capacitor/app']) throw new Error('Missing @capacitor/app in lockfile');
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify fresh web bundle is packaged
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR=android/app/src/main/assets/public/assets
          test -d "$ASSET_DIR"
          test -n "$(find "$ASSET_DIR" -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          for needle in cp104ImageBtn insertFileBtn cp104-inline-note cp104FileEditModal; do
            if ! grep -Rqs -- "$needle" "$ASSET_DIR"; then
              echo "ERROR: fresh Capacitor bundle is missing: $needle"
              find "$ASSET_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
              exit 1
            fi
          done
          test -f android/app/src/main/java/com/catatanpintar/app/PdfViewerPlugin.java
          test -f android/app/src/main/java/com/catatanpintar/app/FileExportPlugin.java

      - name: Verify release tag matches app version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ inputs.release_tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          test "$APP_VERSION" = "$TAG_VERSION"

      - name: Verify compatibility signing key
        run: |
          test -f android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Gradle wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build compatibility release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "${BUILD_TOOLS}/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanPintar-release-${{ inputs.release_tag }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
